<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Shifa Medical Lab - Staff Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-wrapper pop-animation">
        <div class="login-card">
            <div class="login-header">
                <h2>🔐 Al Shifa <span class="blue-accent">Staff Access</span></h2>
                <p>Secure login for laboratory professionals</p>
            </div>
            <form id="staffLoginForm">
                <div class="form-group">
                    <label>Employee ID / Username</label>
                    <input type="text" id="loginUsername" placeholder="medstaff@alshifa" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn full-width">Login to Dashboard</button>
                <div id="loginMessage" class="status-message"></div>
            </form>
            <p class="back-link"><a href="index.html">← Back to Patient Portal</a></p>
            <div class="demo-note">Demo Credentials: any username / password "demo123"</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
